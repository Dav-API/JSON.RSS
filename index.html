    <div class="d-grid gap-2">

      <button onclick="javascript:window.open('https://codepen.io/davidsonbpe')" class="mt-1 btn btn-secondary rounded-0 text-start fs-6 text-uppercase opacity-75" type="button">

      <button onclick="javascript:window.open('https://davidsonbpe.blogspot.com/')" class="mt-1 btn btn-secondary rounded-0 text-start fs-6 text-uppercase opacity-75" type="button">
        <i class="bi bi-justify-left float-start pe-3"></i> Developer
      </button>
      <button  id="shareButton" onclick="share(this)" class="mt-1 btn btn-secondary rounded-0 text-start fs-6 text-uppercase opacity-75" type="button">
        <i class="bi bi-justify-left float-start pe-3"></i> Compartilhar
      </button>
    </div>
  </div>

  <div class="p-2 border-top">

    <button type="button" class="btn btn-secondary rounded-0 fs-6 ps-4 pe-4 text-uppercase float-end opacity-75" data-bs-dismiss="offcanvas">Sair</button>

<!-- MENU -->


<body class="bg-dark">

  <nav class="navbar sticky-top bg-colorstat rounded-0 rounded shadow">
    <div class="container-fluid">
      <button class="navbar-toggler border-0" type="button" title="MENU" data-bs-toggle="offcanvas" data-bs-target="#offcanvasmenu" aria-controls="offcanvasmenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <a class="navbar-brand">JSON.RSS</a>
      <button type="button" class="btn btn-link text-dark" id="shareButton" onclick="share(this)">
        <i class="bi bi-share-fill"></i>
      </button>
    </div>
  </nav>

  <div id="app">

    <div class="container pt-3">

      <div class="row row-cols-1 row-cols-md-2 g-4">
        <div class="col" v-for="post, invers in posts , +nuber" :key="invers">

          <div class="card rounded-0 border-0">

            <div class="card-footer border-0">
              <small class="text-muted float-start text-uppercase"><i class="bi bi-person-circle"></i>
                {{posts.items[invers].author}}</small>

              <small class="text-muted float-end text-uppercase"><i class="bi bi-calendar-event"></i>
                {{posts.items[invers].date}}</small>
            </div>

            <a :href="posts.items[invers].url" target="_parent" class="card mb-3 rounded-0 border-0">
              <img :src="thum+posts.items[invers].enclosure.url" class="card-img-top rounded-0">
            </a>

            <div class="card-body">
              <h5 class="card-title">{{ posts.items[invers].title }}</h5>
              <p class="card-text">{{ posts.items[invers].description }}.</p>

          
            </div>
            <div class="btn-group w-100" role="group">
              <a type="button" class="btn btn-light rounded-0 w-100  text-uppercase  border-end" :href="posts.items[invers].url" target="_blank"><i
                  class="bi bi-instagram float-start"></i> Postagem</a>
              <a type="button" class="btn btn-light rounded-0 w-100 border-start  text-uppercase" :href="tilharurl+posts.items[invers].url" target="_blank">
                <i class="bi bi-share-fill float-start"></i>
                Compartilhar</a>
            </div>
          </div>
        </div>

      </div>

      <div class="pt-5"></div>

      <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
        <div class="col-md-4 d-flex align-items-center">
          <a class="mb-3 me-2 mb-md-0 text-white-50 text-decoration-none lh-1">
            <i class="bi bi-film fs-1"></i>
          </a>
          <span class="mb-3 mb-md-0 text-white-50">&copy; 2025 Company, Inc</span>
        </div>

        <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
          <li class="ms-3">
            <a class="text-white-50" target="_blank"
              href="https://codepen.io/davidsonbpe/">
              <i class="bi bi-stack fs-2"></i>
            </a>
          </li>
          <li class="ms-3"><a class="text-white-50" target="_blank"
              href="https://github.com/Dav-API">
              <i class="bi bi-github fs-2"></i>
          </li>
          <li class="ms-3">
            <a class="text-white-50" target="_blank" href="https://www.youtube.com/@decomtvs">
              <i class="bi bi-youtube fs-2"></i>
            </a>

          </li>
        </ul>
      </footer>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://redek-dp.github.io/servdevanalytics/server.id.js"></script>
  <script src="./d-framework/js/script.js"></script>

</body>

</html>
